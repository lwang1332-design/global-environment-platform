<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>环境适应性评估报告</title><style>
:root{--nav:#0b2548;--blue:#1557d6;--line:#dbe3ee;--muted:#667085;--red:#c83d3d;--orange:#b96b0c;--green:#087a59}
*{box-sizing:border-box}body{margin:0;background:#edf1f6;color:#1f2937;font:12px/1.55 Arial,"Microsoft YaHei",sans-serif}.toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:7px;padding:8px 12px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--nav)}.paper{width:210mm;min-height:297mm;margin:14px auto;background:#fff;box-shadow:0 8px 30px #0001}.cover{height:297mm;padding:28mm 20mm;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#fff 58%,#eef4ff)}.brand{font-weight:800;color:var(--blue);letter-spacing:1.5px}.cover h1{font-size:30px;line-height:1.2;color:var(--nav);margin:12mm 0 5mm}.cover .sub{font-size:15px;color:#506079}.meta{border-top:2px solid var(--blue);padding-top:8mm;display:grid;grid-template-columns:1fr 1fr;gap:4mm 12mm}.meta div{font-size:12px}.meta b{display:block;color:#5f6b7c;font-size:10px;margin-bottom:1mm}.page{padding:14mm 16mm;min-height:275mm;page-break-before:always}.sec{margin-bottom:9mm}.sec h2{font-size:18px;color:var(--nav);border-bottom:2px solid var(--blue);padding-bottom:3mm;margin:0 0 4mm}.sec h3{font-size:13px;color:var(--nav);margin:5mm 0 2mm}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm}.kpi{border:1px solid var(--line);border-radius:3mm;padding:4mm}.kpi small{color:var(--muted);font-size:9px}.kpi b{display:block;margin-top:2mm;color:var(--nav);font-size:16px}.risk-high{color:var(--red)!important}.risk-mid{color:var(--orange)!important}.risk-low{color:var(--green)!important}table{width:100%;border-collapse:collapse;font-size:10px;table-layout:fixed}th,td{border:1px solid #e2e7ef;padding:2.5mm;vertical-align:top;word-break:break-word}th{background:#f4f7fb;color:#536172;text-align:left}.note{background:#f7faff;border-left:3px solid var(--blue);padding:3mm 4mm;color:#445269}.chips{display:flex;gap:2mm;flex-wrap:wrap}.chip{background:#eef4ff;color:#164a99;border-radius:99px;padding:1.5mm 3mm;font-size:9px}.scene-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm}.scene-card{border:1px solid var(--line);border-left:4px solid var(--green);border-radius:2mm;padding:3mm}.scene-card.high{border-left-color:var(--red)}.scene-card.mid{border-left-color:var(--orange)}.scene-card.low{border-left-color:var(--green)}.scene-card h4{margin:0 0 1mm;color:var(--nav);font-size:11px}.scene-card p{margin:1mm 0;font-size:9px;color:#667085}.list{margin:0;padding-left:5mm}.list li{margin:1.5mm 0}.footer-note{font-size:9px;color:#7b8795;margin-top:5mm}.empty{padding:8mm;text-align:center;color:#7c8796}
@media print{body{background:#fff}.toolbar{display:none}.paper{margin:0;box-shadow:none;width:auto}.cover,.page{page-break-after:always}.page:last-child{page-break-after:auto}@page{size:A4;margin:0}}
</style></head><body><div class="toolbar"><div><b>PDF报告模板 · V2.7</b><span style="color:#667085;margin-left:8px">浏览器打印时选择“另存为 PDF”</span></div><div><button class="btn secondary" onclick="history.back()">返回平台</button> <button class="btn primary" onclick="window.print()">导出 PDF</button></div></div><div id="report"></div><script>
const KEY='ea_v27_report_snapshot';const s=JSON.parse(localStorage.getItem(KEY)||'null');const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function riskTxt(v){return v>=2?'高':v===1?'中':'低'}function riskCls(v){return v>=2?'risk-high':v===1?'risk-mid':'risk-low'}function matchCls(v){return v>=70?'high':v>=45?'mid':'low'}function matchTxt(v){return v>=70?'高匹配':v>=45?'中匹配':'低匹配'}
function tbl(headers,rows,widths=[]){return `<table><thead><tr>${headers.map((h,i)=>`<th${widths[i]?` style="width:${widths[i]}"`:''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
if(!s){document.getElementById('report').innerHTML='<div class="paper"><div class="empty">尚无报告数据。请返回平台完成项目环境分析后，再点击“报告输出”。</div></div>';}
else{
const p=s.project,e=s.env,period=`最近${p.periodYears}年`,res=s.summary.residual;
const envRows=[['P99最高气温',e.t99,'℃'],['极端最低气温',e.tmin,'℃'],['年均相对湿度',e.rhAvg,'%'],['RH>90%',e.rh90,'h/y'],['年降水量',e.rainYear,'mm/y'],['最大1h降水',e.rain1h,'mm/h'],['海拔',e.alt,'m'],['PM10',e.pm10,'μg/m³'],['Dust',e.dust,'μg/m³'],['Sea Salt Aerosol',e.salt,'μg/m³'],['SO₂',e.so2,'μg/m³'],['年降雪小时',e.snowHours,'h/y'],['P95风速',e.wind95,'m/s'],['P95太阳辐射',e.rad95,'W/m²']].map(x=>[x[0],Number(x[1]).toFixed(1),x[2]]);
const cover=`<div class="paper cover"><div><div class="brand">ENVIRONMENTAL ADAPTABILITY ENGINEERING REPORT</div><h1>风电机组环境适应性<br>智能决策报告</h1><div class="sub">项目环境 → 场景识别 → 客户诉求 → 产品设计需求 → 场景方案 → 升级包 → Design Gap</div></div><div class="meta"><div><b>项目名称</b>${esc(p.name)}</div><div><b>项目位置</b>${esc(p.place)}</div><div><b>经纬度</b>${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</div><div><b>气象统计周期</b>${period}</div><div><b>机组类型</b>${esc(p.machineType)}</div><div><b>机组基础配置</b>${esc(p.machineLevel)}</div><div><b>报告版本</b>${esc(s.version)}</div><div><b>生成时间</b>${new Date(s.generatedAt).toLocaleString()}</div></div></div>`;
const page1=`<div class="paper page"><div class="sec"><h2>Executive Summary｜项目综合结论</h2><div class="summary"><div class="kpi"><small>主场景</small><b>${esc(s.selectedScene)}</b></div><div class="kpi"><small>主方案</small><b>${esc(s.plan.name)}</b></div><div class="kpi"><small>升级包</small><b>${s.packages.length} 项</b></div><div class="kpi"><small>剩余风险</small><b class="${riskCls(res)}">${riskTxt(res)}</b></div></div><div class="note" style="margin-top:4mm">建议配置：<b>${esc(s.selectedScene)} · ${esc(s.plan.name)}</b>${s.packages.length?' + '+s.packages.map(x=>esc(x.name)).join(' + '):''}。本报告所有设计需求均保留对应环境参数证据，便于转入整机/子系统需求与项目技术澄清。</div></div><div class="sec"><h2>01 项目信息</h2>${tbl(['项目项','内容'],[['项目名称',esc(p.name)],['项目位置',esc(p.place)],['经纬度',`${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}`],['机组类型',esc(p.machineType)],['机组基础配置',esc(p.machineLevel)],['气象统计周期',period]],['28%','72%'])}</div><div class="sec"><h2>02 项目环境体检</h2>${tbl(['环境参数','统计值','单位'],envRows,['45%','30%','25%'])}<div class="footer-note">风险等级阈值采用本次管理员参数快照，空气质量/CAMS数据范围可能与ERA5气象统计周期不同，详见第09章数据接入状态。</div></div></div>`;
const sceneCards=s.scenes.map(x=>`<div class="scene-card ${matchCls(x.score)}"><h4>${esc(x.name)}</h4><p><b>${matchTxt(x.score)} · ${x.score}%</b></p><p>${esc(x.basis)}</p></div>`).join('');
const page2=`<div class="paper page"><div class="sec"><h2>03 识别场景</h2><div class="note">匹配规则：采用“核心指标 + 辅助指标”加权评分；高匹配≥70%，中匹配45–69%，低匹配<45%；常温内陆采用专项环境风险反向扣分。</div><div class="scene-grid" style="margin-top:4mm">${sceneCards}</div></div><div class="sec"><h2>04 客户核心诉求</h2>${tbl(['客户核心诉求','客户语言','环境依据'],s.demands.map(x=>[esc(x.title),esc(x.text),esc(x.evidence)]),['24%','46%','30%'])}</div><div class="sec"><h2>05 转化为产品设计需求</h2>${tbl(['来源','气象/环境依据','产品设计需求','验证/判定'],s.requirements.map(x=>[esc(x.source),esc(x.evidence),esc(x.requirement),esc(x.verify)]),['16%','25%','39%','20%'])}</div></div>`;
const page3=`<div class="paper page"><div class="sec"><h2>06 匹配场景方案</h2><div class="summary"><div class="kpi"><small>选定场景</small><b>${esc(s.selectedScene)}</b></div><div class="kpi"><small>方案等级</small><b>${esc(s.plan.name)}</b></div></div><h3>方案措施</h3><ul class="list">${s.plan.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="sec"><h2>07 推荐升级包</h2>${tbl(['升级包','推荐等级','适用风险/触发条件','具体方案/措施'],s.packages.map(x=>[esc(x.name),x.level>=3?'强烈推荐':x.level===2?'推荐':'可选',esc(x.apply),esc(x.desc)]),['18%','14%','28%','40%'])}</div><div class="sec"><h2>08 Design Gap</h2>${tbl(['能力域','环境要求','当前基础','主方案','升级包','综合已具备','剩余风险'],s.gaps.map(x=>[esc(x.domain),x.need+'/3',x.base+'/3','+'+x.plan,'+'+x.pkg,x.supplied+'/3',`<b class="${riskCls(x.rem)}">${riskTxt(x.rem)} (${x.rem})</b>`]),['18%','12%','12%','12%','12%','16%','18%'])}</div></div>`;
const page4=`<div class="paper page"><div class="sec"><h2>09 数据接入状态</h2>${tbl(['数据源','用途','状态','实际返回'],s.status.map(x=>[esc(x.source),esc(x.usage),esc(x.state),esc(x.return)]),['22%','33%','15%','30%'])}</div><div class="sec"><h2>10 项目输出</h2><div class="note"><b>最终建议：</b>${esc(s.selectedScene)} · ${esc(s.plan.name)}${s.packages.length?' + '+s.packages.map(x=>esc(x.name)).join(' + '):''}。</div><h3>升级包清单</h3><div class="chips">${s.packages.map(x=>`<span class="chip">${esc(x.name)}</span>`).join('')}</div><h3>Design Gap结论</h3><p>综合剩余风险：<b class="${riskCls(res)}">${riskTxt(res)}</b>。如存在中/高剩余风险，应进一步提高主方案等级、增加专项升级包或补充验证。</p></div><div class="sec"><h2>附录A｜计算规则及参数快照</h2>${tbl(['环境参数','方向','中风险阈值','高风险阈值'],Object.entries(s.riskRules).map(([k,r])=>[`${esc(r.label)} (${k})`,r.direction==='low'?'数值越低风险越高':'数值越高风险越高',`${r.medium} ${esc(r.unit)}`,`${r.high} ${esc(r.unit)}`]),['38%','24%','19%','19%'])}<div class="footer-note">本报告用于工程决策与方案筛选。最终产品设计边界、材料牌号、涂层体系、IP等级、过滤等级、除湿量等应结合项目技术规范和验证结果冻结。</div></div></div>`;
document.getElementById('report').innerHTML=cover+page1+page2+page3+page4;
}
</script></body></html>

name: Fix V2.5 Demand Fusion Route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v25-demand-fusion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add demand fusion script to v2.5 route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v2.5.html')
          s=p.read_text(encoding='utf-8')
          marker='v2.5-demand-fusion.js?v=20260905-fusion2'
          if marker not in s:
              old='</body></html>'
              if old not in s:
                  raise SystemExit('v2.5.html tail marker not found')
              s=s.replace(old, f'<script src="{marker}"></script></body></html>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit route fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2.5.html
          if git diff --cached --quiet; then
            echo 'v2.5.html already loads demand fusion.'
            exit 0
          fi
          git commit -m 'Restore demand accordion on V2.5 platform route'
          git push

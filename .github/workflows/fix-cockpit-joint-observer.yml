name: Fix Cockpit Joint Observer

on:
  push:
    paths:
      - '.github/workflows/fix-cockpit-joint-observer.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch presentation observer only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/cockpit-v29.js')
          s=p.read_text(encoding='utf-8')
          old="const joint=q('#jointCard');if(joint&&!joint.dataset.cockpitObserved){joint.dataset.cockpitObserved='1';new MutationObserver(()=>renderJointStats()).observe(joint,{childList:true,subtree:true,characterData:true})}"
          new="const joint=q('#jointCard');if(joint&&!joint.dataset.cockpitObserved){joint.dataset.cockpitObserved='1';let scheduled=false;new MutationObserver(records=>{const own=r=>{const el=r.target?.nodeType===1?r.target:r.target?.parentElement;return !!el?.closest?.('#cockpitJointStats')};if(records.length&&records.every(own))return;if(scheduled)return;scheduled=true;setTimeout(()=>{scheduled=false;renderJointStats()},0)}).observe(joint,{childList:true,subtree:true,characterData:true})}"
          if old not in s: raise SystemExit('observer marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check assets/cockpit-v29.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cockpit-v29.js
          git commit -m 'Fix V2.9 cockpit wind-temperature observer recursion'
          git push origin main

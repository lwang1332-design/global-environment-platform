name: Patch V2.8 Report Curves and Core Data

on:
  push:
    paths:
      - 'tools/fix_v28_report_v3_duplicate.py'
      - '.github/workflows/patch-v28-report-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix report code
        run: python tools/fix_v28_report_v3_duplicate.py
      - name: Commit report fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix V2.8 report duplicate declaration"
          git push

name: Upgrade V2.8 Engineering Report

on:
  push:
    paths:
      - 'tools/upgrade_v28.py'
      - '.github/workflows/upgrade-v28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V2.8 upgrade
        run: python tools/upgrade_v28.py
      - name: Commit V2.8
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade platform to V2.8 engineering report edition"
          git push

name: Patch Cockpit Acceptance Runner

on:
  push:
    paths:
      - '.github/workflows/patch-cockpit-e2e-path.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix runner script location and remove one-shot workflow
        run: |
          sed -i 's#/tmp/cockpit-check.mjs#cockpit-check.mjs#g' .github/workflows/cockpit-ui-e2e.yml
          git rm .github/workflows/patch-cockpit-e2e-path.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cockpit-ui-e2e.yml
          git commit -m 'Fix V2.9 cockpit browser acceptance runner'
          git push origin main

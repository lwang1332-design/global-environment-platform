name: E2E Live Check

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright@1.55.0
          npx playwright install chromium
      - name: Check ERA5 endpoint
        run: |
          python - <<'PY'
          import json, urllib.request
          u='https://archive-api.open-meteo.com/v1/archive?latitude=30.5085&longitude=47.7804&start_date=2025-01-01&end_date=2025-01-03&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,precipitation,snowfall,wind_speed_10m,shortwave_radiation,surface_pressure,cloud_cover&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum&timezone=UTC&wind_speed_unit=ms&models=era5'
          with urllib.request.urlopen(u, timeout=60) as r:
              j=json.load(r)
          assert len(j['hourly']['temperature_2m'])>0
          print('ERA5_OK', len(j['hourly']['temperature_2m']), j['hourly']['temperature_2m'][:3])
          PY
      - name: Browser V2.8 map calculation and report check
        run: |
          cat > e2e.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1000}});
          page.on('console', m=>console.log('BROWSER',m.type(),m.text()));
          page.on('pageerror', e=>console.log('PAGEERROR',e.message));
          const url='https://lwang1332-design.github.io/global-environment-platform/?e2e=v28-'+Date.now();
          let resp;
          for(let i=0;i<6;i++){
            resp=await page.goto(url+'&try='+i,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(4000);
            const body=await page.locator('body').innerText();
            if(body.includes('V2.8') && await page.locator('#pdfReport').count()) break;
            await page.waitForTimeout(7000);
          }
          console.log('PAGE_STATUS',resp?.status(), 'TITLE', await page.title());
          const body0=await page.locator('body').innerText();
          if(!body0.includes('V2.8')) throw new Error('V2.8 not deployed yet');
          if(await page.locator('#pdfReport').count()!==1 || await page.locator('#wordReport').count()!==1) throw new Error('Report buttons missing');
          if(await page.locator('#p_saltVd').count()!==1 || await page.locator('#p_filterBypass').count()!==1 || await page.locator('#p_condDtMin').count()!==1) throw new Error('V2.8 admin parameters missing');
          const frame=page.locator('#osmFrame');
          const mapCount=await frame.count();
          const mapSrc=mapCount?await frame.getAttribute('src'):'';
          console.log('MAP_READY',mapCount>0,'MAP_SRC',mapSrc);
          if(mapCount===0 || !mapSrc?.includes('openstreetmap.org/export/embed.html')) throw new Error('OSM iframe map not initialized');
          await page.locator('#query').fill('30.5085,47.7804');
          await page.locator('#years').selectOption('1');
          await page.locator('#go').click();
          await page.waitForFunction(()=>{const s=document.querySelector('#status')?.textContent||'';return s.includes('真实数据计算完成')||s.includes('查询失败');},{timeout:180000});
          const status=await page.locator('#status').textContent();
          console.log('FINAL_STATUS',status);
          if(!status.includes('真实数据计算完成')) throw new Error('Calculation failed: '+status);
          const mapSrcAfter=await page.locator('#osmFrame').getAttribute('src');
          if(!(mapSrcAfter?.includes('30.5085') && mapSrcAfter?.includes('47.7804'))) throw new Error('Map did not move to project coordinates');
          const reportCheck=await page.evaluate(()=>{
            const html=reportHtml();
            return {len:html.length, title:html.includes('全球风电机组环境适应性工程评估报告'), v28:html.includes('V2.8'), filter:Number.isFinite(result?.dust?.penetration), dt:result?.condensation?.params?.dt_min};
          });
          console.log('REPORT_CHECK',reportCheck);
          if(!reportCheck.title || !reportCheck.v28 || reportCheck.len<5000) throw new Error('Engineering report generation invalid');
          if(!reportCheck.filter) throw new Error('Filter penetration result missing');
          if(reportCheck.dt!==10) throw new Error('Condensation substep default not applied');
          const body=await page.locator('body').innerText();
          if(body.includes('NaN')) throw new Error('NaN found in rendered output');
          await browser.close();
          JS
          node e2e.mjs

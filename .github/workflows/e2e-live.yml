name: E2E Live Check

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright@1.55.0
          npx playwright install chromium
      - name: Check ERA5 endpoint
        run: |
          python - <<'PY'
          import json, urllib.request
          u='https://archive-api.open-meteo.com/v1/archive?latitude=30.5085&longitude=47.7804&start_date=2025-01-01&end_date=2025-01-03&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,precipitation,snowfall,wind_speed_10m,shortwave_radiation,surface_pressure,cloud_cover&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum&timezone=UTC&wind_speed_unit=ms&models=era5'
          with urllib.request.urlopen(u, timeout=60) as r:
              j=json.load(r)
          assert len(j['hourly']['temperature_2m'])>0
          print('ERA5_OK', len(j['hourly']['temperature_2m']), j['hourly']['temperature_2m'][:3])
          PY
      - name: Browser V2.8 report curves and toolbar check
        run: |
          cat > e2e.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1000}});
          page.on('console', m=>console.log('BROWSER',m.type(),m.text()));
          page.on('pageerror', e=>console.log('PAGEERROR',e.message));
          const url='https://lwang1332-design.github.io/global-environment-platform/?e2e=reportv3-final-'+Date.now();
          let resp;
          for(let i=0;i<12;i++){
            resp=await page.goto(url+'&try='+i,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(4000);
            const ready=await page.evaluate(()=>{
              const body=document.body?.innerText||'';
              const src=document.documentElement?.innerHTML||'';
              return body.includes('02 环境数据') && body.includes('07 工程决策建议') && !!document.querySelector('#pdfReport') && !document.querySelector('#wordReport') && src.includes('<th>核心数据</th>') && src.includes('温度 / 露点时序');
            });
            if(ready) break;
            await page.waitForTimeout(6000);
          }
          console.log('PAGE_STATUS',resp?.status(), 'TITLE', await page.title());
          const body0=await page.locator('body').innerText();
          if(!body0.includes('02 环境数据')) throw new Error('02 title not updated');
          if(!body0.includes('07 工程决策建议')) throw new Error('07 title not updated');
          if(body0.includes('设计能力满足率')) throw new Error('Design capability satisfaction rate still visible');
          if(await page.locator('#pdfReport').count()!==1) throw new Error('PDF button missing');
          if(await page.locator('#wordReport').count()!==0) throw new Error('Word button should be hidden from web UI');
          const frame=page.locator('#osmFrame');
          const mapSrc=await frame.getAttribute('src');
          if(!mapSrc?.includes('openstreetmap.org/export/embed.html')) throw new Error('OSM iframe map not initialized');
          await page.locator('#query').fill('30.5085,47.7804');
          await page.locator('#years').selectOption('1');
          await page.locator('#go').click();
          await page.waitForFunction(()=>{const s=document.querySelector('#status')?.textContent||'';return s.includes('真实数据计算完成')||s.includes('查询失败');},{timeout:180000});
          const status=await page.locator('#status').textContent();
          console.log('FINAL_STATUS',status);
          if(!status.includes('真实数据计算完成')) throw new Error('Calculation failed: '+status);
          const reportCheck=await page.evaluate(()=>{
            const html=reportHtml();
            return {
              len:html.length,
              title:html.includes('全球风电机组环境适应性工程评估报告'),
              detailed:html.includes('03 气象环境统计') && html.includes('10 环境 × 设备风险矩阵') && html.includes('12 综合工程结论'),
              coreHeader:html.includes('<th>核心数据</th>'),
              coreParams:html.includes('P99阵风') && html.includes('TOW') && html.includes('PM10 P95'),
              curves:html.includes('温度 / 露点时序') && html.includes('相对湿度时序') && html.includes('风速 / 阵风时序') && html.includes('小时降雨时序') && html.includes('短波辐射时序') && html.includes('表面气压时序'),
              noEquipPriority:!html.includes('设备侧优先级'),
              conclusionParams:html.includes('主要环境风险') && html.includes('（风险 '),
              noAdminSnapshot:!html.includes('管理员参数快照'),
              noAdaptRate:!html.includes('设计能力满足率'),
              filter:Number.isFinite(result?.dust?.penetration),
              dt:result?.condensation?.params?.dt_min
            };
          });
          console.log('REPORT_CHECK',reportCheck);
          if(!reportCheck.title || !reportCheck.detailed || reportCheck.len<15000) throw new Error('Detailed engineering report invalid');
          if(!reportCheck.coreHeader || !reportCheck.coreParams) throw new Error('Core environmental data missing from risk section');
          if(!reportCheck.curves) throw new Error('Meteorological time-series curves missing');
          if(!reportCheck.noEquipPriority) throw new Error('Equipment-side priority still present');
          if(!reportCheck.conclusionParams) throw new Error('Conclusion environmental parameters missing');
          if(!reportCheck.noAdminSnapshot || !reportCheck.noAdaptRate) throw new Error('Hidden report content regression');
          if(!reportCheck.filter) throw new Error('Filter penetration result missing');
          if(reportCheck.dt!==10) throw new Error('Condensation substep default not applied');
          const body=await page.locator('body').innerText();
          if(body.includes('NaN')) throw new Error('NaN found in rendered output');
          await browser.close();
          JS
          node e2e.mjs

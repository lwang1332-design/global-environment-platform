name: E2E Live Check

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Browser V2.8 integrated check
        run: |
          cat > e2e.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const url='https://lwang1332-design.github.io/global-environment-platform/?e2e=0107-final-'+Date.now();
          const expected=['01 项目定位','02 项目综合信息','03 环境数据','04 环境风险画像','05 物理模型实时计算结果','06 环境 × 设备风险矩阵','07 工程决策建议'];
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(3000);
          const shell=await page.evaluate((expected)=>{
            const hs=[...document.querySelectorAll('#mainPage .dashboard>.card>.head>h2')].map(x=>x.textContent.trim());
            const tiles=[...document.querySelectorAll('.osmTile')];
            return {
              order:JSON.stringify(hs)===JSON.stringify(expected),
              headings:hs,
              pdf:!!document.querySelector('#pdfReport'),
              word:!!document.querySelector('#wordReport'),
              map:!!document.querySelector('.osmCompatMap'),
              loaded:tiles.filter(x=>x.complete&&x.naturalWidth>0).length,
              embedded:!!document.querySelector('.embeddedWorldMap'),
              oldHeading:document.body.innerText.includes('04 项目综合结论')
            };
          },expected);
          console.log('SHELL',shell);
          if(!shell.order||!shell.pdf||shell.word||!shell.map||shell.oldHeading) throw new Error('Dashboard shell regression: '+JSON.stringify(shell));

          await page.locator('#query').fill('30.5085,47.7804');
          await page.locator('#years').selectOption('1');
          await page.locator('#go').click();
          await page.waitForFunction(()=>{const s=document.querySelector('#status')?.textContent||'';return s.includes('真实数据计算完成')||s.includes('查询失败');},{timeout:180000});
          const status=await page.locator('#status').textContent();
          console.log('FINAL_STATUS',status);
          if(!status.includes('真实数据计算完成')) throw new Error('Calculation failed: '+status);

          const calculated=await page.evaluate(()=>{
            const risk=[...document.querySelectorAll('.riskActual')].map(x=>x.textContent.trim());
            const html=reportHtml();
            return {
              riskCount:risk.length,
              riskNonEmpty:risk.filter(Boolean).length,
              riskSample:risk.slice(0,3),
              noNaN:!document.body.innerText.includes('NaN'),
              reportLen:html.length,
              reportCore:html.includes('<th>核心数据</th>')&&html.includes('P99阵风')&&html.includes('PM10 P95')&&html.includes('TOW'),
              curves:html.includes('温度 / 露点时序')&&html.includes('相对湿度时序')&&html.includes('风速 / 阵风时序'),
              filter:Number.isFinite(result?.dust?.penetration),
              dt:result?.condensation?.params?.dt_min
            };
          });
          console.log('CALCULATED',calculated);
          if(calculated.riskCount<10||calculated.riskNonEmpty<10) throw new Error('Risk actual-data text missing after calculation');
          if(!calculated.noNaN||calculated.reportLen<15000||!calculated.reportCore||!calculated.curves||!calculated.filter||calculated.dt!==10) throw new Error('Calculation/report regression: '+JSON.stringify(calculated));
          await browser.close();
          JS
          node e2e.mjs

name: Fix PDF Report Goldwind Logo Position

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact uploaded Goldwind logo and header position
        run: |
          python - <<'PY'
          import re, base64, pathlib
          p=pathlib.Path('index.html')
          s=p.read_text(encoding='utf-8')
          b64='[... ELLIPSIZATION ...]'
          old_css=r'\.reportLogo\{position:fixed;left:[^;]+;top:[^;]+;width:[^;]+;height:[^;]+;z-index:1000;display:flex;align-items:[^}]+\}\.reportLogo img\{width:100%;height:auto;display:block\}'
          new_css='.reportLogo{position:fixed;left:12.7mm;top:12.7mm;width:36mm;height:auto;z-index:1000;display:block}.reportLogo img{width:100%;height:auto;display:block}.reportHeaderSpace{height:8mm}'
          s,n=re.subn(old_css,new_css,s,count=1)
          if n!=1:
              raise SystemExit('reportLogo CSS not found')
          s,n=re.subn(r'<div class="reportLogo" aria-label="Goldwind"><img src="[^"]+" alt="Goldwind"></div>', '<div class="reportLogo" aria-label="Goldwind"><img src="data:image/png;base64,'+b64+'" alt="Goldwind"></div>', s, count=1)
          if n!=1:
              raise SystemExit('reportLogo markup not found')
          # reserve header room so fixed logo never overlaps report content
          s=s.replace('@page{size:A4;margin:13mm 13mm 13mm}', '@page{size:A4;margin:24mm 13mm 13mm}', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit exact logo placement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Place exact Goldwind logo at 12.7mm PDF header offset"
          git push

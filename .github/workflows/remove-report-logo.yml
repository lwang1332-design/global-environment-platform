name: Remove PDF Report Logo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Feishu mobile map compatibility
        run: python tools/fix_feishu_map.py
      - name: Upgrade to Tianditu and local open-source dual map
        run: |
          if grep -q "const MAP_DEFAULTS=" index.html; then
            echo "Dual-source map already applied"
          else
            python tools/upgrade_dual_map.py
          fi
      - name: Remove report logo and restore compact top margin
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('@page{size:A4;margin:24mm 13mm 13mm}','@page{size:A4;margin:13mm 13mm 13mm}')
          import re
          s=re.sub(r'\.reportLogo\{[^}]*\}\.reportLogo img\{[^}]*\}\.reportHeaderSpace\{[^}]*\}', '', s)
          s=re.sub(r'\s*<div class="reportLogo" aria-label="Goldwind"><img src="data:image/png;base64,[^"]+" alt="Goldwind"></div>\s*', '\n ', s)
          p.write_text(s,encoding='utf-8')
          assert 'class="reportLogo"' not in s
          assert '.reportLogo{' not in s
          assert '@page{size:A4;margin:13mm 13mm 13mm}' in s
          assert 'osmCompatMap' in s
          assert 'tile.openstreetmap.org' in s
          assert 'tianditu.gov.cn' in s
          assert 'MAP_DEFAULTS' in s
          assert 'mapSourceBadge' in s
          assert 'openstreetmap.org/export/embed.html' not in s
          assert 'id="osmFrame"' not in s
          PY
      - name: Commit map fix and logo state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Keep dual-source map and PDF logo state stable'
          git push

name: Remove PDF Report Logo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove report logo and restore compact top margin
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('@page{size:A4;margin:24mm 13mm 13mm}','@page{size:A4;margin:13mm 13mm 13mm}')
          import re
          s=re.sub(r'\.reportLogo\{[^}]*\}\.reportLogo img\{[^}]*\}\.reportHeaderSpace\{[^}]*\}', '', s)
          s=re.sub(r'\s*<div class="reportLogo" aria-label="Goldwind"><img src="data:image/png;base64,[^"]+" alt="Goldwind"></div>\s*', '\n ', s)
          p.write_text(s,encoding='utf-8')
          assert 'class="reportLogo"' not in s
          assert '.reportLogo{' not in s
          assert '@page{size:A4;margin:13mm 13mm 13mm}' in s
          PY
      - name: Commit logo removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove Goldwind logo from V2.8 PDF report'
          git push

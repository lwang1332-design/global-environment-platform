name: Patch unchecked defaults and stable packages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-default-unchecked-stable-packages.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch selection defaults and package interaction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Customer demands: default unchecked in both base and primary/secondary fusion UI.
          for name in ['v2.5-app.js', 'v2.5-demand-fusion.js']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace("if(!(key in demandManual))demandManual[key]=true;",
                            "if(!(key in demandManual))demandManual[key]=false;")
              p.write_text(s, encoding='utf-8')

          # 2) Upgrade packages: default unchecked, sort only by risk/recommendation level,
          #    never by checked state.
          p = Path('v2.5-app.js')
          s = p.read_text(encoding='utf-8')
          old_entries = "function packageEntries(){const entries=activePackages.map((p,i)=>({p,i,auto:packageTrigger(p)}));for(const x of entries)if(!(x.i in packageManual))packageManual[x.i]=x.auto>=2;return entries.sort((a,b)=>b.auto-a.auto||Number(packageManual[b.i])-Number(packageManual[a.i])||a.i-b.i)}"
          new_entries = "function packageEntries(){const entries=activePackages.map((p,i)=>({p,i,auto:packageTrigger(p)}));for(const x of entries)if(!(x.i in packageManual))packageManual[x.i]=false;return entries.sort((a,b)=>b.auto-a.auto||a.i-b.i)}"
          if old_entries not in s:
              raise SystemExit('packageEntries baseline not found')
          s = s.replace(old_entries, new_entries, 1)

          start = s.find('function renderPackages(){')
          end = s.find('\n\nconst GAP_DOMAINS', start)
          if start < 0 or end < 0:
              raise SystemExit('renderPackages block not found')
          new_render = r'''function renderPackages(){let n=0;const entries=packageEntries();$('packageGrid').innerHTML=entries.map(x=>{const {p,i,auto}=x,sel=packageManual[i];if(sel)n++;const txt=auto>=3?'强烈推荐':auto===2?'推荐':auto===1?'可选':'不触发',cl=auto>=3?'strong':auto===2?'auto':'';return `<div class="package ${sel?'selected':''}"><input type="checkbox" ${sel?'checked':''} onchange="packageManual[${i}]=this.checked;this.closest('.package').classList.toggle('selected',this.checked);$('pkgCount').textContent=activePackages.reduce((n,p,j)=>n+(packageManual[j]?1:0),0)+' 个升级包';renderGap();renderResult()"><span class="tag ${cl}">${txt}</span><h4>${p[0]}</h4><p><b>适用：</b>${p[1]}<br>${p[2]}</p><small>风险/推荐等级 ${auto}/3 · 按等级固定排序 · 默认不勾选</small></div>`}).join('');$('pkgCount').textContent=n+' 个升级包'}'''
          s = s[:start] + new_render + s[end:]
          p.write_text(s, encoding='utf-8')

          # 3) Force browsers to fetch the updated JS instead of the previous cached accordion asset.
          p = Path('v2.7.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('v2.5-app.js?v=20260905-cloud1', 'v2.5-app.js?v=20260905-unchecked1')
          s = s.replace('v2.5-demand-fusion.js?v=20260905-accordion3', 'v2.5-demand-fusion.js?v=20260905-unchecked1')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate behavior markers
        shell: bash
        run: |
          grep -q "demandManual\[key\]=false" v2.5-demand-fusion.js
          grep -q "packageManual\[x.i\]=false" v2.5-app.js
          grep -q "b.auto-a.auto||a.i-b.i" v2.5-app.js
          ! grep -q "Number(packageManual\[b.i\])-Number(packageManual\[a.i\])" v2.5-app.js
          grep -q "classList.toggle('selected',this.checked)" v2.5-app.js
          grep -q "v2.5-demand-fusion.js?v=20260905-unchecked1" v2.7.html
          node --check v2.5-app.js
          node --check v2.5-demand-fusion.js

      - name: Commit patched UI behavior
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2.5-app.js v2.5-demand-fusion.js v2.7.html
          git commit -m 'Default demands and packages unchecked and keep package order stable'
          git push

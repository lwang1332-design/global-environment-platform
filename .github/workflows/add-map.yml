name: Add Resilient Map

on:
  push:
    paths:
      - 'tools/replace_map_with_osm_iframe.py'
      - '.github/workflows/add-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map
        run: python tools/replace_map_with_osm_iframe.py
      - name: Commit map
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use CDN-free OpenStreetMap iframe"
          git push

name: Replace Web Header GE with Goldwind Logo
on:
  push:
    paths:
      - '.github/workflows/replace-web-header-logo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Goldwind logo asset
        shell: bash
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 'https://upload.wikimedia.org/wikipedia/commons/e/e5/Goldwind_Updated_Logo.png' -o assets/goldwind-logo.png
          test -s assets/goldwind-logo.png
      - name: Replace GE badge in HTTPS web header
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_css='.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--navy),var(--blue));color:#fff;display:grid;place-items:center;font-weight:900}'
          new_css='.logo{width:112px;height:30px;display:flex;align-items:center;justify-content:flex-start;flex:0 0 auto;background:transparent;border-radius:0;color:inherit}.logo img{display:block;width:100%;height:auto;max-height:30px;object-fit:contain;object-position:left center}'
          if old_css in s:
              s=s.replace(old_css,new_css,1)
          elif '.logo{width:112px;height:30px;' not in s:
              raise SystemExit('desktop logo CSS target not found')
          old_markup='<div class="logo">GE</div>'
          new_markup='<div class="logo"><img src="./assets/goldwind-logo.png" alt="Goldwind"></div>'
          if old_markup in s:
              s=s.replace(old_markup,new_markup,1)
          elif new_markup not in s:
              raise SystemExit('GE logo markup target not found')
          old_mobile='.brand{gap:8px;min-width:0}.logo{width:34px;height:34px;flex:0 0 auto}'
          new_mobile='.brand{gap:10px;min-width:0}.logo{width:104px;height:28px;flex:0 0 auto}.logo img{max-height:28px}'
          if old_mobile in s:
              s=s.replace(old_mobile,new_mobile,1)
          p.write_text(s,encoding='utf-8')
      - name: Verify web header
        shell: bash
        run: |
          grep -q 'assets/goldwind-logo.png' index.html
          ! grep -q '<div class="logo">GE</div>' index.html
          test -s assets/goldwind-logo.png
      - name: Commit HTTPS web logo change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/goldwind-logo.png
          git diff --cached --quiet && exit 0
          git commit -m 'Replace web header GE badge with Goldwind logo'
          git push

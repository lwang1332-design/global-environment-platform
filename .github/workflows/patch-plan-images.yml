name: Patch plan images UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-plan-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch loaders and report
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('v2.7.html')
          s=p.read_text()
          if 'v2.5-plan-images.js' not in s:
              s=s.replace('</body></html>','<script src="v2.5-plan-images.js?v=20260906-planimg1"></script></body></html>')
          p.write_text(s)

          p=Path('v2.5-admin-cloud.html')
          s=p.read_text()
          if 'v2.5-admin-plan-images.js' not in s:
              s=s.replace('</body></html>','<script src="v2.5-admin-plan-images.js?v=20260906-planimg1"></script></body></html>')
          s=s.replace('href="v2.5.html?v=20260905-cloud1"','href="v2.7.html?v=20260906-planimg1"')
          p.write_text(s)

          p=Path('v2.5-report.html')
          s=p.read_text()
          css='.report-plan-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:5mm;align-items:start}.report-plan-figure{margin:0;border:1px solid var(--line);border-radius:2mm;padding:2mm;background:#fafbfd}.report-plan-figure img{width:100%;max-height:68mm;object-fit:contain;display:block;background:#fff}.report-plan-figure figcaption{font-size:9px;color:var(--muted);text-align:center;margin-top:2mm}@media print{.report-plan-figure img{max-height:62mm}}'
          if '.report-plan-layout' not in s:
              s=s.replace('@media print{',css+'\n@media print{')
          old='<h3>方案措施</h3><ul class="list">${s.plan.items.map(x=>`<li>${esc(x)}</li>`).join(\'\')}</ul>'
          new='<div class="report-plan-layout"><div><h3>方案措施</h3><ul class="list">${s.plan.items.map(x=>`<li>${esc(x)}</li>`).join(\'\')}</ul></div>${s.plan.imageUrl?`<figure class="report-plan-figure"><img src="${esc(s.plan.imageUrl)}" alt="${esc(s.plan.imageCaption||s.plan.name+\' 方案图\')}" onerror="this.closest(\'figure\').remove()"><figcaption>${esc(s.plan.imageCaption||s.plan.name+\' 方案图\')}</figcaption></figure>`:\'\'}</div>'
          if old in s:
              s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2.7.html v2.5-admin-cloud.html v2.5-report.html
          if ! git diff --cached --quiet; then
            git commit -m "Add plan image display upload controls and report output"
            git push
          fi

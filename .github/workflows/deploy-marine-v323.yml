name: Deploy marine corrosion V3.2.3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-marine-v323.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified V3.2.3 bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/marine-v323-final/*.part | tr -d '\r\n' | base64 -d > /tmp/marine-v323-final.tar.gz
          echo 'f99b20d5bd17f7d4613463063b43d482387e42d8fd67130d4878af7048f77ffd  /tmp/marine-v323-final.tar.gz' | sha256sum -c -
          rm -rf /tmp/marine-v323
          mkdir -p /tmp/marine-v323
          tar -xzf /tmp/marine-v323-final.tar.gz -C /tmp/marine-v323
          test -s /tmp/marine-v323/index.html
          test -s /tmp/marine-v323/styles.css
          test -s /tmp/marine-v323/app-browser.js
          test -s /tmp/marine-v323/loading-v323.js

      - name: Replace production GitHub Pages app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p marine-corrosion
          cp /tmp/marine-v323/index.html marine-corrosion/index.html
          cp /tmp/marine-v323/styles.css marine-corrosion/styles.css
          cp /tmp/marine-v323/app-browser.js marine-corrosion/app-browser.js
          cp /tmp/marine-v323/loading-v323.js marine-corrosion/loading-v323.js
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('marine-corrosion/deployment.json')
          data = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          data.update({
              'name': '全球海洋大气腐蚀环境评估平台',
              'version': '3.2.3',
              'frontendEntry': 'https://lwang1332-design.github.io/global-environment-platform/marine-corrosion/',
              'frontendRuntime': 'GitHub Pages native static app',
              'frontendTarget': 'https://lwang1332-design.github.io/global-environment-platform/marine-corrosion/',
              'directApi': 'https://global-marine-corrosion-direct-v322-lwang1332-4885.vercel.app/api/direct',
              'dataChain': ['ERA5 Direct','CAMS EAC4 / Forecast','CMEMS','Open-Meteo fallback'],
              'startupPolicy': {
                  'annualDataOnInitialLoad': False,
                  'healthCheckTimeoutSeconds': 4,
                  'historicalPeriodsYears': [1,3,5],
                  'stages': ['GIS','ERA5/CAMS/CMEMS','Hourly timeline','Physics / ISO 9223'],
                  'progressUnit': 'hours'
              },
              'calibration': {'rawRows':641,'independentRows':121,'globalBenchmarkPoints':26},
              'notes': 'V3.2.3 is served natively by GitHub Pages. Initial annual data load is zero; real annual data begins only after the user starts calculation. RAW/Fallback/EST provenance remains explicit.'
          })
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          grep -q 'V3.2.3' marine-corrosion/index.html
          grep -q 'loading-v323.js' marine-corrosion/index.html
          grep -q 'app-browser.js' marine-corrosion/index.html
          if grep -q 'location.replace' marine-corrosion/index.html; then
            echo 'Unexpected launcher redirect remains in index.html' >&2
            exit 1
          fi

      - name: Commit production replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marine-corrosion/index.html marine-corrosion/styles.css marine-corrosion/app-browser.js marine-corrosion/loading-v323.js marine-corrosion/deployment.json
          if git diff --cached --quiet; then
            echo 'No changes to deploy.'
          else
            git commit -m 'Deploy marine corrosion V3.2.3 native staged loading'
            git push origin HEAD:main
          fi

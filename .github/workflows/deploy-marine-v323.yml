name: Deploy marine corrosion V3.2.3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-marine-v323.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write V3.2.3 GitHub Pages application
        shell: python
        run: |
          import base64, gzip, pathlib
          payload = '''[... ELLIPSIZATION ...]'''
          out = pathlib.Path('marine-corrosion/index.html')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(gzip.decompress(base64.b64decode(payload)))
          print(f'wrote {out} ({out.stat().st_size} bytes)')
      - name: Commit deployed page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marine-corrosion/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Deploy marine corrosion V3.2.3 staged loading"
            git push
          fi

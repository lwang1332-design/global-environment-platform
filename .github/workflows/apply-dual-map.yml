name: Apply Dual Map Source
on:
  push:
    branches: ["main"]
    paths:
      - "tools/upgrade_dual_map.py"
      - ".github/workflows/apply-dual-map.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply dual-source map patch
        run: python tools/upgrade_dual_map.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade map to Tianditu and local open-source dual source"
          git push
# trigger: dual-map-v1

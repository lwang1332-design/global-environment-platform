name: Marine Corrosion V3.3 Science

on:
  push:
    branches:
      - v3.3.0-science-model
    paths:
      - 'marine-corrosion/model-v330.js'
      - 'marine-corrosion/sources-v330.js'
      - 'marine-corrosion/gis-browser-v330.js'
      - 'marine-corrosion/run-controller-v330.js'
      - 'marine-corrosion/model-worker-v330.js'
      - 'marine-corrosion/review-ui-v330.js'
      - 'marine-corrosion/v330-ui-patch.js'
      - 'marine-corrosion/model-v328.js'
      - 'marine-corrosion/run-controller.js'
      - 'marine-corrosion/gis-browser-v328.js'
      - 'marine-corrosion/review-ui.js'
      - 'marine-corrosion/tests/v330-science.test.mjs'
      - '.github/workflows/marine-corrosion-v330-science.yml'
  workflow_dispatch:

jobs:
  science-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check V3.3 modules
        run: |
          node --check marine-corrosion/model-v330.js
          node --check marine-corrosion/sources-v330.js
          node --check marine-corrosion/run-controller-v330.js
          node --check marine-corrosion/model-worker-v330.js
          node --check marine-corrosion/review-ui-v330.js
          node --check marine-corrosion/v330-ui-patch.js
          node --check marine-corrosion/tests/v330-science.test.mjs
      - name: Run V3.3 science regressions
        run: node --test marine-corrosion/tests/v330-science.test.mjs

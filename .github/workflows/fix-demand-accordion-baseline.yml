name: Fix Demand Accordion Baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-demand-accordion-baseline.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch V2.7 demand accordion baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Make demand-fusion safe on every route and visible before first environment query.
          p=Path('v2.5-demand-fusion.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("let ranked=Array.isArray(lastSceneRanking)&&lastSceneRanking.length?lastSceneRanking:[];",
                      "let ranked=(typeof lastSceneRanking!=='undefined'&&Array.isArray(lastSceneRanking)&&lastSceneRanking.length)?lastSceneRanking:[];")
          old="""    if(!contexts.length){
      $('demandCount').textContent='0 条核心诉求';
      grid.className='demands demand-accordion';
      grid.innerHTML='<div class=\"empty\">完成项目环境分析后，系统将叠加主场景与次场景的客户核心诉求。</div>';
      return;
    }"""
          new="""    if(!contexts.length){
      $('demandCount').textContent='0 条核心诉求';
      grid.className='demands demand-accordion';
      grid.innerHTML=`<div class=\"demand-summary\">
        <div class=\"demand-summary-head\"><b>已选诉求</b><span>0 / 0</span></div>
        <div class=\"demand-summary-chips\"><span class=\"demand-summary-empty\">完成项目环境分析后自动汇总已选诉求</span></div>
      </div>
      <div class=\"demand-panel open demand-placeholder\">
        <button type=\"button\" class=\"demand-panel-head\" disabled>
          <span class=\"demand-panel-arrow\">▾</span>
          <span class=\"demand-panel-title\"><b>主场景｜等待识别</b><small>默认展开</small></span>
          <span class=\"demand-panel-count\">已选 0/0</span>
        </button>
        <div class=\"demand-panel-body\"><div class=\"empty\">查询项目环境后，在这里展开显示主场景客户诉求。</div></div>
      </div>
      <div class=\"demand-panel closed demand-placeholder\">
        <button type=\"button\" class=\"demand-panel-head\" disabled>
          <span class=\"demand-panel-arrow\">▸</span>
          <span class=\"demand-panel-title\"><b>次场景｜等待识别</b><small>默认折叠</small></span>
          <span class=\"demand-panel-count\">已选 0/0</span>
        </button>
      </div>`;
      return;
    }"""
          if old not in s:
              raise SystemExit('Demand empty-state block not found')
          s=s.replace(old,new,1)
          s=s.replace("  if(Object.keys(env||{}).length){renderDemands();renderRequirements();renderPackages();renderGap();renderResult();}\n})();",
                      "  renderDemands();\n  if(Object.keys(env||{}).length){renderRequirements();renderPackages();renderGap();renderResult();}\n})();",1)
          p.write_text(s,encoding='utf-8')

          # 2) V2.7 is the canonical cloud route; force fresh accordion asset and cloud admin link.
          p=Path('v2.7.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('href=\"v2.5-admin.html?v=20260905-cloud1\"','href=\"v2.5-admin-cloud.html?v=20260905-accordion3\"')
          s=s.replace('v2.5-demand-fusion.js?v=20260905-fusion2','v2.5-demand-fusion.js?v=20260905-accordion3')
          p.write_text(s,encoding='utf-8')

          # 3) Keep legacy V2.5 route functionally aligned, including cloud scene model.
          p=Path('v2.5.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('href=\"v2.5-admin.html\"','href=\"v2.5-admin-cloud.html?v=20260905-accordion3\"')
          s=s.replace('<script src=\"v2.5-app.js\"></script><script src=\"v2.5-demand-fusion.js?v=20260905-fusion2\"></script>',
                      '<script src=\"v2.5-app.js?v=20260905-accordion3\"></script><script src=\"v2.5-cloud.js?v=20260905-scene3\"></script><script src=\"v2.5-demand-fusion.js?v=20260905-accordion3\"></script>')
          p.write_text(s,encoding='utf-8')

          # 4) Admin always returns to canonical V2.7 cloud route.
          p=Path('v2.5-admin-cloud.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('href=\"v2.5.html?v=20260905-cloud1\"','href=\"v2.7.html?v=20260905-accordion3\"')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate baseline markers
        shell: bash
        run: |
          grep -q 'v2.5-demand-fusion.js?v=20260905-accordion3' v2.7.html
          grep -q '主场景｜等待识别' v2.5-demand-fusion.js
          grep -q '次场景｜等待识别' v2.5-demand-fusion.js
          grep -q "demandPanelOpen={主场景:true,次场景:false}" v2.5-demand-fusion.js
          grep -q 'v2.7.html?v=20260905-accordion3' v2.5-admin-cloud.html
          node --check v2.5-demand-fusion.js
      - name: Commit fixed UI baseline
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2.5-demand-fusion.js v2.7.html v2.5.html v2.5-admin-cloud.html
          git commit -m 'Make demand accordion the fixed V2.7 UI baseline'
          git push

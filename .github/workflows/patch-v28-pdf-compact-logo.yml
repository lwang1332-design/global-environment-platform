name: Patch V2.8 PDF Compact Layout and Logo

on:
  push:
    paths:
      - 'tools/patch_v28_pdf_compact_logo.py'
      - '.github/workflows/patch-v28-pdf-compact-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact PDF layout and logo patch
        run: python tools/patch_v28_pdf_compact_logo.py
      - name: Commit report update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Optimize V2.8 PDF pagination and add Goldwind logo"
          git pull --rebase origin main
          git push

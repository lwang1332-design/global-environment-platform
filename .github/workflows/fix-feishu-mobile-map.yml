name: Fix Feishu Mobile Map
on:
  push:
    paths:
      - '.github/workflows/fix-feishu-mobile-map.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace iframe map with WebView-safe OSM tiles
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('#map{height:calc(100% - 34px)}','#map{height:100%;background:#eef4fb}',1)
          s=s.replace('.mapWrap{height:100%;position:relative}', '.mapWrap{height:calc(100% - 34px);position:relative}',1)

          css_anchor='.mapWrap{height:calc(100% - 34px);position:relative}'
          compat_css=""".osmCompatMap{position:relative;width:100%;height:100%;overflow:hidden;background:#dfeaf4}.osmTileLayer{position:absolute;width:768px;height:768px;will-change:transform}.osmTile{position:absolute;width:256px;height:256px;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}.osmMarker{position:absolute;left:50%;top:50%;width:24px;height:24px;background:#78b82a;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:translate(-50%,-100%) rotate(-45deg);box-shadow:0 2px 8px rgba(0,0,0,.38);z-index:5;pointer-events:none}.osmMarker:after{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;left:6px;top:6px}.osmZoom{position:absolute;right:8px;top:8px;z-index:6;display:flex;flex-direction:column;border:1px solid #d7dde6;border-radius:7px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.12)}.osmZoom button{width:34px;height:32px;border:0;border-radius:0;background:#fff;color:#26364d;font-size:20px;line-height:30px;padding:0;font-weight:700}.osmZoom button+button{border-top:1px solid #d7dde6}.osmAttrib{position:absolute;right:5px;bottom:4px;z-index:6;background:rgba(255,255,255,.88);border-radius:4px;padding:2px 5px;font-size:7px;color:#526173}.osmAttrib a{color:#355b8a;text-decoration:none}@media(max-width:900px){.mapCard{min-height:344px!important}.mapWrap{height:310px!important;min-height:310px}.osmZoom button{width:38px;height:36px;font-size:22px}.osmAttrib{font-size:8px}}"""
          if '.osmCompatMap{' not in s:
              if css_anchor not in s:
                  raise SystemExit('mapWrap CSS anchor not found')
              s=s.replace(css_anchor, css_anchor+compat_css,1)

          start=s.find("let map={setView")
          end_token='renderOsmMap();'
          end=s.find(end_token,start)
          if start<0 or end<0:
              raise SystemExit('old map implementation not found')
          end += len(end_token)
          new_map=r'''let mapState={lat:20,lon:15,name:'全球项目位置',zoom:2};
let map={setView(v,z){if(Array.isArray(v)&&v.length>=2)renderOsmMap(+v[0],+v[1],mapState.name,Number.isFinite(+z)?+z:mapState.zoom)},invalidateSize(){if(mapState)renderOsmMap(mapState.lat,mapState.lon,mapState.name,mapState.zoom)},on(){}};
let marker={setLatLng(){return this},bindPopup(){return this},openPopup(){return this}};
const mapEl=$('map');
function osmWorldPixel(lat,lon,zoom){
 const z=Math.max(2,Math.min(9,Math.round(zoom||2))),n=Math.pow(2,z),safeLat=Math.max(-85.0511,Math.min(85.0511,+lat||0));
 const sin=Math.sin(safeLat*Math.PI/180),x=(+lon+180)/360*n*256,y=(.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*n*256;
 return{x,y,z,n};
}
function mapZoom(delta){renderOsmMap(mapState.lat,mapState.lon,mapState.name,Math.max(2,Math.min(9,mapState.zoom+delta)))}
function renderOsmMap(lat=20,lon=15,name='全球项目位置',zoom=2){
 if(!mapEl)return;
 lat=Number(lat);lon=Number(lon);if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
 const w=osmWorldPixel(lat,lon,zoom),tileX=Math.floor(w.x/256),tileY=Math.floor(w.y/256),fx=w.x-tileX*256,fy=w.y-tileY*256;
 const cols=3,rows=3,half=1,centerPxX=half*256+fx,centerPxY=half*256+fy;
 let tiles='';
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
   const dx=c-half,dy=r-half,x=((tileX+dx)%w.n+w.n)%w.n,y=tileY+dy;
   if(y<0||y>=w.n)continue;
   tiles+=`<img class="osmTile" alt="" draggable="false" src="https://tile.openstreetmap.org/${w.z}/${x}/${y}.png" style="left:${c*256}px;top:${r*256}px" onerror="this.style.visibility='hidden'">`;
 }
 mapState={lat,lon,name:name||'项目位置',zoom:w.z};
 mapEl.innerHTML=`<div class="osmCompatMap" role="img" aria-label="OpenStreetMap 项目位置地图"><div class="osmTileLayer" style="left:calc(50% - ${centerPxX}px);top:calc(50% - ${centerPxY}px)">${tiles}</div><div class="osmMarker" aria-hidden="true"></div><div class="osmZoom"><button type="button" aria-label="放大地图" onclick="mapZoom(1)">+</button><button type="button" aria-label="缩小地图" onclick="mapZoom(-1)">−</button></div><div class="osmAttrib">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div></div>`;
}
function updateMapLocation(lat,lon,name){
 if(!Number.isFinite(Number(lat))||!Number.isFinite(Number(lon)))return;
 renderOsmMap(Number(lat),Number(lon),name||'项目位置',6);
}
renderOsmMap();'''
          s=s[:start]+new_map+s[end:]
          p.write_text(s,encoding='utf-8')

      - name: Update E2E for Feishu mobile WebView map
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/e2e-live.yml')
          s=p.read_text(encoding='utf-8')
          old="""          const frame=page.locator('#osmFrame');
          const mapSrc=await frame.getAttribute('src');
          if(!mapSrc?.includes('openstreetmap.org/export/embed.html')) throw new Error('OSM iframe map not initialized');
"""
          new="""          const mapCheck=await page.evaluate(()=>({tiles:document.querySelectorAll('#map .osmTile').length,compat:!!document.querySelector('#map .osmCompatMap'),iframe:!!document.querySelector('#osmFrame'),height:document.querySelector('#map')?.getBoundingClientRect().height||0}));
          console.log('MAP_CHECK',mapCheck);
          if(!mapCheck.compat || mapCheck.iframe || mapCheck.tiles<4 || mapCheck.height<120) throw new Error('WebView-safe OSM tile map not initialized');
"""
          if old not in s:
              raise SystemExit('old iframe E2E assertion not found')
          s=s.replace(old,new,1)
          old_ready="return body.includes('02 环境数据') && body.includes('07 工程决策建议') && !!document.querySelector('#pdfReport') && !document.querySelector('#wordReport') && src.includes('<th>核心数据</th>') && src.includes('温度 / 露点时序');"
          new_ready="return body.includes('02 环境数据') && body.includes('07 工程决策建议') && !!document.querySelector('#pdfReport') && !document.querySelector('#wordReport') && src.includes('<th>核心数据</th>') && src.includes('温度 / 露点时序') && !!document.querySelector('#map .osmCompatMap') && !document.querySelector('#osmFrame');"
          if old_ready in s:
              s=s.replace(old_ready,new_ready,1)
          close="""          await browser.close();
"""
          mobile="""          const mobile=await browser.newPage({viewport:{width:390,height:844},userAgent:'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Mobile Safari/537.36 Lark/7.50.0 Feishu'});
          let mobileReady=false;
          for(let i=0;i<10;i++){
            await mobile.goto(url+'&feishuMobile=1&try='+i,{waitUntil:'domcontentloaded',timeout:60000});
            await mobile.waitForTimeout(2500);
            mobileReady=await mobile.evaluate(()=>!!document.querySelector('#map .osmCompatMap')&&!document.querySelector('#osmFrame'));
            if(mobileReady)break;
            await mobile.waitForTimeout(3000);
          }
          const mobileMap=await mobile.evaluate(()=>({height:document.querySelector('#map')?.getBoundingClientRect().height||0,wrapHeight:document.querySelector('.mapWrap')?.getBoundingClientRect().height||0,tiles:document.querySelectorAll('#map .osmTile').length,iframe:!!document.querySelector('#osmFrame')}));
          console.log('FEISHU_MOBILE_MAP',mobileMap);
          if(!mobileReady || mobileMap.iframe || mobileMap.tiles<4 || mobileMap.height<280 || mobileMap.wrapHeight<280) throw new Error('Feishu mobile map layout/compatibility failed');
          await mobile.close();
          await browser.close();
"""
          if close not in s:
              raise SystemExit('browser close anchor not found')
          s=s.replace(close,mobile,1)
          p.write_text(s,encoding='utf-8')

      - name: Verify compatibility patch
        shell: bash
        run: |
          grep -q 'osmCompatMap' index.html
          grep -q 'tile.openstreetmap.org' index.html
          ! grep -q 'export/embed.html' index.html
          grep -q 'FEISHU_MOBILE_MAP' .github/workflows/e2e-live.yml
      - name: Commit Feishu mobile map fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/e2e-live.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix mobile Feishu map with iframe-free OSM tiles'
          git push

name: Refine V2.8 Dashboard Sequence
on:
  push:
    branches: ["main"]
    paths:
      - "tools/refine_v28_dashboard_sequence.py"
      - ".github/workflows/refine-v28-dashboard-sequence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply sequential dashboard refinement
        run: python tools/refine_v28_dashboard_sequence.py
      - name: Validate order and layout
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          order=['01 项目定位','02 项目综合信息','03 环境数据','04 环境风险画像','05 物理模型实时计算结果','06 环境 × 设备风险矩阵','07 工程决策建议']
          positions=[h.index(x) for x in order]
          assert positions==sorted(positions),positions
          assert 'grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:24% 34% 42%' in h
          assert '.mapCard{grid-column:1 / span 3;grid-row:1}' in h
          assert '.decisionCard{grid-column:9 / span 4;grid-row:3}' in h
          print('sequence validation OK')
          PY
      - name: Commit refinement
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Align dashboard visual order with 01-07 sequence"
          git push

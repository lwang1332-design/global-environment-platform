name: Marine Corrosion V3.3.1 Browser

on:
  push:
    branches:
      - v3.3.1-calculability
    paths:
      - 'marine-corrosion/**'
      - '.github/workflows/marine-corrosion-v331-browser.yml'
  workflow_dispatch:

jobs:
  browser-v331:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/marine-v331-http.log 2>&1 &
          echo $! > /tmp/marine-v331-http.pid
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/marine-corrosion/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/marine-v331-http.log
          exit 1
      - name: Verify V3.3.1 calculability UI
        run: |
          cat > /tmp/marine-v331-browser.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1100}});
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror:'+e.message));
          page.on('console',m=>{
            if(m.type()!=='error')return;
            const text=m.text();
            const external=/global-marine-corrosion-direct-v322|blocked by CORS policy|Access-Control-Allow-Origin|ERR_CERT|Failed to load resource/i.test(text);
            if(!external)errors.push('console:'+text);
          });
          await page.goto('http://127.0.0.1:4173/marine-corrosion/?v=3.3.1-ci',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForSelector('#v331InputPanel',{timeout:30000});
          await page.waitForTimeout(1200);
          const ui=await page.evaluate(()=>({
            title:document.title,
            brand:document.querySelector('.brand-title')?.textContent||'',
            panel:!!document.querySelector('#v331InputPanel'),
            l1:document.querySelector('#v331L1')?.textContent||'',
            l2:document.querySelector('#v331L2')?.textContent||'',
            l3:document.querySelector('#v331L3')?.textContent||'',
            mode:document.querySelector('#v331So2Mode')?.value,
            status:document.querySelector('#v331Status')?.textContent||'',
            overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
          }));
          console.log('UI',ui);
          if(!ui.title.includes('V3.3.1')||!ui.brand.includes('V3.3.1'))throw new Error('V3.3.1 branding missing');
          if(!ui.panel||!/环境Screening/.test(ui.l1)||!/腐蚀Screening/.test(ui.l2)||!/正式ISO/.test(ui.l3))throw new Error('Calculability ladder missing');
          if(ui.mode!=='auto'||ui.overflow>2)throw new Error('Default calculability UI regression');
          await page.selectOption('#v331So2Mode','pc');
          await page.fill('#v331So2Pc','10');
          await page.waitForTimeout(300);
          const pcVisible=await page.locator('#v331PcField').evaluate(el=>!el.classList.contains('v331-hidden'));
          const pdHidden=await page.locator('#v331PdField').evaluate(el=>el.classList.contains('v331-hidden'));
          if(!pcVisible||!pdHidden)throw new Error('SO2 input mode visibility failed');
          const policy=await page.evaluate(async()=>{
            const p=await import('./input-policy-v331.js?ci='+Date.now());
            const m=await import('./model-v330.js?ci='+Date.now());
            return {app:p.APP_VERSION,science:m.MODEL_VERSION,pd:p.deriveManagedOverrides({so2Mode:'pc',so2Pc:10},{}).so2Dep,formal:p.inputReadiness({so2Mode:'pc',so2Pc:10,isoSd:20}).formalIsoManualReady};
          });
          console.log('POLICY',policy);
          if(policy.app!=='3.3.1'||policy.science!=='3.3.0'||policy.pd!==8||policy.formal!==true)throw new Error('V3.3.1 policy/science guard failed');
          if(errors.length)throw new Error('Browser errors: '+errors.join(' | '));
          await browser.close();
          JS
          node /tmp/marine-v331-browser.mjs

name: Finalize Mobile Map Height
on:
  push:
    paths:
      - '.github/workflows/finalize-mobile-map-height.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final mobile map CSS override
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* final-mobile-map-visible-v1 */'
          css='''\n/* final-mobile-map-visible-v1 */\n@media(max-width:900px){\n .mapCard{height:360px!important;min-height:360px!important}\n .mapCard .mapWrap{height:322px!important;min-height:322px!important;position:relative!important}\n .mapCard #map{height:322px!important;min-height:322px!important;width:100%!important;display:block!important;background:#eef4fb}\n .mapCard .osmCompatMap{height:322px!important;min-height:322px!important;width:100%!important;display:block!important}\n .mapCard .mapOverlay{display:block!important;visibility:visible!important;z-index:20!important;left:8px!important;bottom:8px!important;max-width:calc(100% - 16px)!important;white-space:normal!important;pointer-events:none}\n}\n'''
          if marker not in s:
              s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify CSS
        run: |
          grep -q 'final-mobile-map-visible-v1' index.html
          grep -q '.mapCard #map{height:322px' index.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Ensure mobile map and location info remain visible'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep 2; continue; }
            git push && exit 0
            sleep 3
          done
          exit 1

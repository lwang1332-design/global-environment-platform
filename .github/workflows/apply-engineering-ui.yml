name: Apply Engineering UI

on:
  push:
    branches: ["main"]
    paths:
      - "tools/ui-engineering-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI bootstrap and repairs
        run: |
          python tools/patch_engineering_ui.py
          python tools/fix_engineering_ui_syntax.py
          node --check assets/ui-engineering.js
      - name: Commit UI changes
        run: |
          if git diff --quiet -- index.html assets/ui-engineering.js; then
            echo "No UI changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/ui-engineering.js
          git commit -m "Repair engineering decision UI"
          git push

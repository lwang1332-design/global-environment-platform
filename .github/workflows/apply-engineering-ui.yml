name: Apply Engineering UI

on:
  push:
    branches: ["main"]
    paths:
      - "tools/ui-engineering-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI bootstrap
        run: python tools/patch_engineering_ui.py
      - name: Commit UI links
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable engineering decision UI"
          git push

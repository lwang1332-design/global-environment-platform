name: Repair Engineering UI

on:
  push:
    branches: ["main"]
    paths:
      - "tools/repair-engineering-ui-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and validate UI script
        run: |
          python tools/fix_engineering_ui_syntax.py
          node --check assets/ui-engineering.js
      - name: Commit repaired UI script
        run: |
          if git diff --quiet -- assets/ui-engineering.js; then
            echo "UI script already valid"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui-engineering.js
          git commit -m "Repair engineering UI JavaScript"
          git push

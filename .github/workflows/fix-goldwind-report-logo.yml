name: Fix Goldwind Report Logo

on:
  push:
    branches: ["main"]
    paths:
      - 'tools/fix_goldwind_report_logo.py'
      - '.github/workflows/fix-goldwind-report-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct PDF logo
        run: python tools/fix_goldwind_report_logo.py
      - name: Commit logo correction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Correct Goldwind logo in V2.8 PDF report"
          git push

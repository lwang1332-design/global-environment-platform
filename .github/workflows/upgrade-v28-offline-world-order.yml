name: Upgrade V2.8 Offline World and Section Order
on:
  push:
    branches: ["main"]
    paths:
      - "tools/upgrade_v28_offline_world_and_order.py"
      - ".github/workflows/upgrade-v28-offline-world-order.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply offline world map and page order patch
        run: python tools/upgrade_v28_offline_world_and_order.py
      - name: Static validation
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          m=Path('map-tier.js').read_text(encoding='utf-8')
          expected=['01 项目定位','02 项目综合信息','03 环境数据','04 环境风险画像','05 物理模型实时计算结果','06 环境 × 设备风险矩阵','07 工程决策建议']
          for x in expected:
              assert x in h,x
          assert '04 项目综合结论' not in h
          assert 'riskActual' in h and 'PM10 P95' in h and 'P99阵风' in h
          assert 'EMBEDDED_WORLD_LAND' in m and 'renderEmbeddedWorldMap' in m
          assert "let z=5;" in m
          assert '在线地图不可达，已自动切换' in m
          print('static validation OK')
          PY
      - name: Commit generated changes
        run: |
          if git diff --quiet -- index.html map-tier.js sw.js; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html map-tier.js sw.js
          git commit -m "Embed lightweight offline world map and reorder dashboard"
          git push

name: Deploy Marine CAMS Backend

on:
  workflow_dispatch:
  push:
    branches:
      - v3.4.0-coastal-corrosion-final
    paths:
      - 'marine-corrosion/direct-backend/api/salt.py'
      - 'marine-corrosion/direct-backend/api/salt_flux.py'
      - 'marine-corrosion/direct-backend/vercel.json'
      - '.github/workflows/deploy-marine-cams-so2-backend.yml'

concurrency:
  group: marine-cams-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_NAME: global-marine-corrosion-direct-v332
      TEAM_SLUG: lwang1332-4885
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CAMS_ADS_API_KEY: ${{ secrets.CAMS_ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets without printing values
        shell: bash
        run: |
          missing=0
          if [ -z "$VERCEL_TOKEN" ]; then echo '::error::Missing GitHub Secret VERCEL_TOKEN'; missing=1; fi
          if [ -z "$CAMS_ADS_API_KEY" ]; then echo '::error::Missing GitHub Secret CAMS_ADS_API_KEY'; missing=1; fi
          exit "$missing"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Link production backend project
        working-directory: marine-corrosion/direct-backend
        run: npx --yes vercel@latest link --yes --project "$PROJECT_NAME" --scope "$TEAM_SLUG" --token "$VERCEL_TOKEN"
      - name: Deploy production backend
        working-directory: marine-corrosion/direct-backend
        shell: bash
        run: npx --yes vercel@latest deploy --prod --yes --scope "$TEAM_SLUG" --token "$VERCEL_TOKEN" --env CAMS_ADS_API_KEY="$CAMS_ADS_API_KEY"
      - name: Smoke-check concentration, deposition flux and SO2 routes
        shell: bash
        run: |
          for path in salt salt_flux so2; do
            code=$(curl -sS -o "/tmp/${path}.json" -w '%{http_code}' "https://global-marine-corrosion-direct-v332.vercel.app/api/${path}" || true)
            test "$code" = "400" || test "$code" = "200" || { cat "/tmp/${path}.json"; exit 1; }
            echo "$path route alive: HTTP $code"
          done
      - name: Record external-data validation boundary
        shell: bash
        run: |
          echo 'Backend deployment gate ends at route health and configuration.'
          echo 'CAMS ADS archived-quarter availability is an external asynchronous dependency and is not a deployment-health signal.'
          echo 'The hard physics/release gate remains Marine Corrosion V3.4.0 Live Validation: four fixed Historical points followed by Current E2E.'

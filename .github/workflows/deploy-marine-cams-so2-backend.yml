name: Deploy Marine CAMS Backend

on:
  workflow_dispatch:
  push:
    branches:
      - v3.4.0-coastal-corrosion-final
    paths:
      - 'marine-corrosion/direct-backend/api/salt.py'
      - 'marine-corrosion/direct-backend/api/salt_flux.py'
      - 'marine-corrosion/direct-backend/vercel.json'
      - '.github/workflows/deploy-marine-cams-so2-backend.yml'

concurrency:
  group: marine-cams-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT_NAME: global-marine-corrosion-direct-v332
      TEAM_SLUG: lwang1332-4885
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CAMS_ADS_API_KEY: ${{ secrets.CAMS_ADS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets without printing values
        shell: bash
        run: |
          missing=0
          if [ -z "$VERCEL_TOKEN" ]; then echo '::error::Missing GitHub Secret VERCEL_TOKEN'; missing=1; fi
          if [ -z "$CAMS_ADS_API_KEY" ]; then echo '::error::Missing GitHub Secret CAMS_ADS_API_KEY'; missing=1; fi
          exit "$missing"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Link production backend project
        working-directory: marine-corrosion/direct-backend
        run: npx --yes vercel@latest link --yes --project "$PROJECT_NAME" --scope "$TEAM_SLUG" --token "$VERCEL_TOKEN"
      - name: Deploy production backend
        working-directory: marine-corrosion/direct-backend
        shell: bash
        run: npx --yes vercel@latest deploy --prod --yes --scope "$TEAM_SLUG" --token "$VERCEL_TOKEN" --env CAMS_ADS_API_KEY="$CAMS_ADS_API_KEY"
      - name: Smoke-check concentration, deposition flux and SO2 routes
        shell: bash
        run: |
          for path in salt salt_flux so2; do
            code=$(curl -sS -o "/tmp/${path}.json" -w '%{http_code}' "https://global-marine-corrosion-direct-v332.vercel.app/api/${path}" || true)
            test "$code" = "400" || test "$code" = "200" || { cat "/tmp/${path}.json"; exit 1; }
            echo "$path route alive: HTTP $code"
          done
      - name: Verify CAMS sea-salt deposition flux quarterly Historical and Current end-to-end
        shell: bash
        run: |
          python3 - <<'PY'
          import json, math, time
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          BASE='https://global-marine-corrosion-direct-v332.vercel.app/api/salt_flux'
          FIELDS=['ssDry1','ssDry2','ssDry3','ssSed1','ssSed2','ssSed3','ssWetConv1','ssWetConv2','ssWetConv3','ssWetLs1','ssWetLs2','ssWetLs3']
          def request_json(method,url,payload=None,timeout=300):
              data=None if payload is None else json.dumps(payload).encode();req=Request(url,data=data,method=method,headers={'Content-Type':'application/json'})
              try:
                  with urlopen(req,timeout=timeout) as r:return r.status,json.loads(r.read().decode())
              except HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  try:parsed=json.loads(body)
                  except Exception:parsed={'raw':body[:1200]}
                  raise RuntimeError(f'HTTP {e.code}: {parsed}') from None
          def wait(label,payload,min_samples,expected_product,max_wait=900):
              code,body=request_json('POST',BASE,payload,60)
              if code!=202 or body.get('configured') is not True:raise RuntimeError(f'{label} submit failed: {code} {body}')
              if body.get('dataset')!='cams-global-atmospheric-composition-forecasts':raise RuntimeError(f'{label} dataset mismatch {body}')
              if body.get('productType')!=expected_product:raise RuntimeError(f'{label} product mismatch {body}')
              if payload.get('chunk') and body.get('chunk')!=payload['chunk']:raise RuntimeError(f'{label} chunk mismatch {body}')
              job=body.get('jobId');deadline=time.time()+max_wait;polls=0
              while time.time()<deadline:
                  polls+=1;time.sleep(max(3,min(15,int(body.get('retryAfterSeconds') or 5))))
                  code,body=request_json('GET',BASE+'?job='+quote(job,safe=''),None,300)
                  if code==202:
                      job=body.get('jobId') or job
                      if polls%6==0:print(label,'poll',polls,body.get('status'))
                      continue
                  if code!=200:raise RuntimeError(f'{label} poll {code}: {body}')
                  times=body.get('time')
                  if not isinstance(times,list) or len(times)<min_samples:raise RuntimeError(f'{label} invalid time axis: {len(times) if isinstance(times,list) else None}')
                  if payload.get('chunk') and body.get('chunk')!=payload['chunk']:raise RuntimeError(f'{label} completed chunk mismatch {body.get("chunk")}')
                  for k in FIELDS:
                      vals=body.get(k)
                      if not isinstance(vals,list) or len(vals)!=len(times):raise RuntimeError(f'{label} invalid {k} array')
                      finite=[float(v) for v in vals if isinstance(v,(int,float)) and math.isfinite(float(v)) and float(v)>=0]
                      if len(finite)<max(1,int(.9*len(times))):raise RuntimeError(f'{label} insufficient finite {k}: {len(finite)}/{len(times)}')
                      if body.get('units',{}).get(k)!='kg/(m²·s)':raise RuntimeError(f'{label} unit mismatch {k}: {body.get("units",{}).get(k)}')
                  print(json.dumps({'label':label,'productType':body.get('productType'),'chunk':body.get('chunk'),'chunkRange':body.get('chunkRange'),'samples':len(times),'coverage':body.get('coverage'),'grid':body.get('grid'),'cycle':body.get('cycle')},ensure_ascii=False));return body
              raise RuntimeError(f'{label} timeout after {max_wait}s')
          total=0
          for chunk in (1,2,3,4):
              body=wait(f'SeaSalt Flux Historical 2025 Q{chunk}',{'lat':18.300797,'lon':109.26452,'mode':'historical','year':2025,'chunk':chunk},650,'ARCHIVED_FORECAST_FLUX')
              total += len(body['time'])
          if total < 2800: raise RuntimeError(f'Historical four-quarter aggregate too short: {total}')
          time.sleep(10)
          wait('SeaSalt Flux Current',{'lat':18.300797,'lon':109.26452,'mode':'current'},20,'FORECAST_FLUX',600)
          print(f'CAMS SEA SALT DEPOSITION FLUX V3.4.0 LIVE E2E PASS; historicalSamples={total}')
          PY

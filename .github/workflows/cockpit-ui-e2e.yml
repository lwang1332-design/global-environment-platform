name: V2.9 Cockpit UI Acceptance

on:
  push:
    paths:
      - '.github/workflows/cockpit-ui-e2e.yml'
      - 'assets/cockpit-v29.css'
      - 'assets/cockpit-v29.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static checks
        run: |
          node --check assets/cockpit-v29.js
          grep -q 'cockpit-v29.css' index.html
          grep -q 'cockpit-v29.js' index.html
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for GitHub Pages cockpit assets
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://lwang1332-design.github.io/global-environment-platform/assets/cockpit-v29.js?v=$GITHUB_SHA" | grep -q 'Engineering Cockpit UI adapter'; then exit 0; fi
            sleep 10
          done
          echo 'Cockpit asset not published in time' >&2
          exit 1
      - name: Responsive browser acceptance
        run: |
          cat > cockpit-check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const errors=[];
          async function check(width,height,label){
            const ctx=await browser.newContext({viewport:{width,height}});
            const page=await ctx.newPage();
            page.on('pageerror',e=>errors.push(`${label}: ${e.message}`));
            page.on('console',m=>{if(m.type()==='error'&&!/429|ERR_FAILED|Failed to load resource/i.test(m.text()))errors.push(`${label}: console ${m.text()}`)});
            await page.route('**/archive-api.open-meteo.com/**',r=>r.abort());
            await page.route('**/air-quality-api.open-meteo.com/**',r=>r.abort());
            await page.route('**/marine-api.open-meteo.com/**',r=>r.abort());
            await page.goto(`https://lwang1332-design.github.io/global-environment-platform/?v=cockpit-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#cockpitLayout',{timeout:20000});
            await page.waitForTimeout(1200);
            const info=await page.evaluate(()=>{
              const rect=s=>document.querySelector(s)?.getBoundingClientRect();
              const cs=s=>document.querySelector(s)?getComputedStyle(document.querySelector(s)):null;
              const logo=document.querySelector('.logo img');
              return {
                overflow:document.documentElement.scrollWidth-window.innerWidth,
                logo:!!logo&&logo.complete&&logo.naturalWidth>0,
                hero:!!document.querySelector('#cockpitHero .mapCard')&&!!document.querySelector('#cockpitHero .summaryCard'),
                kpis:document.querySelectorAll('#cockpitKpiGrid .cockpitKpi').length,
                analysis:!!document.querySelector('#cockpitAnalysis .riskCard')&&!!document.querySelector('#cockpitAnalysis #jointCard'),
                phys:!!document.querySelector('#cockpitPhysCards'),
                matrix:!!document.querySelector('#cockpitMatrixSection .matrixCard'),
                decision:!!document.querySelector('#cockpitDecision #cockpitTopRisks')&&!!document.querySelector('#cockpitDecision .decisionCard'),
                sources:!!document.querySelector('#cockpitSources #sourceStatusGrid'),
                heroCols:cs('#cockpitHero')?.gridTemplateColumns||'',
                kpiCols:cs('#cockpitKpiGrid')?.gridTemplateColumns||'',
                physCols:cs('#cockpitPhysCards')?.gridTemplateColumns||'',
                mapW:rect('.mapCard')?.width||0, sumW:rect('.summaryCard')?.width||0,
                mapH:rect('.mapCard')?.height||0,
                goH:rect('#go')?.height||0,pdfH:rect('#pdfReport')?.height||0
              };
            });
            console.log(label,info);
            if(info.overflow>2)throw new Error(`${label} horizontal overflow ${info.overflow}`);
            if(!info.logo||!info.hero||info.kpis!==8||!info.analysis||!info.phys||!info.matrix||!info.decision||!info.sources)throw new Error(`${label} cockpit structure incomplete ${JSON.stringify(info)}`);
            if(width>=1280&&!(info.mapW>info.sumW))throw new Error(`${label} hero not 60/40-like`);
            if(width<=760&&(info.goH<44||info.pdfH<44))throw new Error(`${label} mobile touch targets under 44px`);
            if(width<=760&&!/^\S+\s+\S+$/.test(info.kpiCols.trim()))throw new Error(`${label} KPI grid is not 2 columns`);
            await page.evaluate(()=>{try{adminUnlocked=true;showPage('admin')}catch(e){throw e}});
            await page.waitForTimeout(150);
            const admin=await page.evaluate(()=>({layout:!!document.querySelector('.cockpitAdminLayout'),nav:document.querySelectorAll('[data-admin-tab]').length,state:!!document.querySelector('#v29ParamState'),overflow:document.documentElement.scrollWidth-window.innerWidth}));
            if(!admin.layout||admin.nav<10||!admin.state||admin.overflow>2)throw new Error(`${label} admin layout failed ${JSON.stringify(admin)}`);
            await ctx.close();
          }
          await check(1920,1080,'desktop-1920');
          await check(1366,768,'desktop-1366');
          await check(900,1024,'tablet');
          await check(390,844,'mobile');
          await browser.close();
          if(errors.length){console.error(errors.join('\n'));process.exit(1)}
          EOF
          node cockpit-check.mjs

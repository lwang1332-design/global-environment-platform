name: Patch demand-driven Design Gap core

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-demand-gap-core.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add core overlay loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v2.7.html')
          s=p.read_text()
          marker='<script src="v2.5-plan-images.js?v=20260906-planmeta1"></script>'
          add=marker+'<script src="v2.5-demand-gap-core.js?v=20260907-core1"></script>'
          if 'v2.5-demand-gap-core.js' not in s:
              if marker not in s: raise SystemExit('plan image loader marker not found')
              s=s.replace(marker,add)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2.7.html
          if ! git diff --cached --quiet; then
            git commit -m "Load demand-driven upgrade and Design Gap core overlay"
            git push
          fi
